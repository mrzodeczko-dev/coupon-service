server:
  forward-headers-strategy: native

spring:
  mvc:
    apiversion:
      default: "1"
      detect-supported: true
      use:
        path-segment: 0
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 2000
      keepalive-time: 30000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

resilience4j:
  circuitbreaker:
    # Explicit aspect order — this is already the default (3), Spring Retry aspect uses
    # Ordered.LOWEST_PRECEDENCE - 1, so CB naturally wraps Retry. Pinned here to guard
    # against silent regressions if a future dependency upgrade changes the default.
    # Effect: CB records one event per logical call; retries do not inflate failure-rate.
    circuit-breaker-aspect-order: 3
    instances:
      geolocation:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - com.rzodeczko.application.exception.GeoLocationNetworkException

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    circuitbreakers:
      enabled: true

logging:
  pattern:
    correlation: " [requestId=%X{requestId:-}]"
